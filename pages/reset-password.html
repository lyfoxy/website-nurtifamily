<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perbarui Kata Sandi — NutriFamily</title>
    <meta name="description" content="Buat kata sandi baru untuk akun NutriFamily." />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/enhance.css" />
    <link rel="icon" href="../assets/img/favicon.png" />
  </head>
  <body class="nf-site" data-page="reset-password">
    <header class="nf-header">
      <div class="nf-header-inner">
        <a class="nf-brand" href="index.html"><img src="../assets/img/logo.jpg" alt="Logo NutriFamily" class="nf-logo">NutriFamily</a>
        <nav class="nf-nav" aria-label="Navigasi utama">
          <a href="index.html" class="">Home</a><a href="index.html#about">About</a
          ><a href="../index.html#contact">Contact</a>
        </nav>
        <div class="nf-header-end"></div>
      </div>
    </header>
    <main class="nf-auth">
      <div class="nf-notice">
        Buat kata sandi baru untuk akun Anda.<br />Gunakan minimal 8 karakter.
      </div>
      <section class="nf-panel nf-auth-card">
        <div class="nf-auth-body">
          <h1>Perbarui Kata Sandi</h1>
          <p>Masukkan kata sandi baru lalu ketik ulang untuk konfirmasi.</p>
          <form data-form="reset">
            <div class="nf-field">
              <label class="form-label" for="password">Kata Sandi Baru</label
              ><input
                class="form-control"
                id="password"
                name="password"
                type="password"
                placeholder="Minimal 8 karakter"
                required
              />
            </div>
            <div class="nf-field">
              <label class="form-label" for="confirm">Konfirmasi Kata Sandi</label
              ><input
                class="form-control"
                id="confirm"
                name="confirm"
                type="password"
                placeholder="Ketik ulang kata sandi"
                required
              />
            </div>
            <button class="btn" type="submit">Simpan Kata Sandi Baru</button>
          </form>
          <div class="nf-auth-bottom"><a href="login.html">Kembali ke Masuk Akun</a></div>
        </div>
      </section>
    </main>
    <div id="nf-modal-host"></div>
    <div id="nf-toast-host" aria-live="polite"></div>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/enhance.js"></script>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
