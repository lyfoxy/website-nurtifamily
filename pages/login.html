<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk Akun — NutriFamily</title>
    <meta name="description" content="Masuk ke akun NutriFamily." />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/enhance.css" />
    <link rel="icon" href="../assets/img/favicon.png" />
  </head>
  <body class="nf-site" data-page="login">
    <header class="nf-header">
      <div class="nf-header-inner">
        <a class="nf-brand" href="../index.html"><img src="../assets/img/logo.jpg" alt="Logo NutriFamily" class="nf-logo">NutriFamily</a>
        <nav class="nf-nav" aria-label="Navigasi utama">
          <a href="../index.html" class="">Home</a><a href="../index.html#about">About</a
          ><a href="../index.html#contact">Contact</a>
        </nav>
        <div class="nf-header-end"></div>
      </div>
    </header>
    <main class="nf-auth">
      <div class="nf-notice">
        Silakan masuk ke akun Anda terlebih dahulu untuk membuka<br />Dashboard dan mengelola
        persediaan bahan makanan.
      </div>
      <section class="nf-panel nf-auth-card">
        <nav class="nf-auth-tabs" aria-label="Akun">
          <a class="active" href="login.html">Masuk Akun</a
          ><a class="" href="register.html">Daftar Baru</a>
        </nav>
        <div class="nf-auth-body">
          <h1>Selamat Datang Kembali</h1>
          <p>Masuk untuk mengakses Dashboard dan manajemen stok dapur Anda.</p>
          <form data-form="login">
            <div class="nf-field">
              <label class="form-label" for="email">Alamat Email</label
              ><input
                class="form-control"
                id="email"
                name="email"
                type="email"
                value=""
                placeholder="sari@nutrifamily.id"
                required
              />
            </div>
            <div class="nf-field">
              <label class="form-label" for="password">Kata Sandi</label
              ><input
                class="form-control"
                id="password"
                name="password"
                type="password"
                value=""
                placeholder="••••••••"
                required
              />
            </div>
            <a href="forgot-password.html">Lupa kata sandi?</a
            ><button class="btn" type="submit">Masuk ke Dashboard</button>
          </form>
          <div class="nf-auth-bottom">
          </div>
        </div>
      </section>
    </main>
    <div id="nf-modal-host"></div>
    <div id="nf-toast-host" aria-live="polite"></div>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/enhance.js"></script>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
