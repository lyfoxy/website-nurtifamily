<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Resep — NutriFamily</title>
    <meta name="description" content="Perbarui resep masakan keluarga." />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
    <link rel="stylesheet" href="../assets/css/enhance.css" />
    <link rel="icon" href="../assets/img/favicon.png" />
  </head>
  <body class="nf-site" data-page="edit-recipe">
    <header class="nf-header">
      <div class="nf-header-inner">
        <a class="nf-brand" href="../index.html"><img src="../assets/img/logo.jpg" alt="Logo NutriFamily" class="nf-logo">NutriFamily</a>
        <div></div>
        <div class="nf-header-end">
          <a class="btn" href="admin.html">Kembali ke Admin</a
          ><button class="btn btn-white" type="button" data-action="logout-admin">Keluar</button>
        </div>
      </div>
    </header>
    <main class="nf-form-page">
      <h1>Edit Data Resep Makanan — Sop Ayam Bening Gurih</h1>
      <p>Perbarui informasi persediaan, kategori, atau tanggal kedaluwarsa untuk bahan ini.</p>
      <section class="nf-panel nf-admin-form">
        <h2>Formulir Ubah Resep</h2>
        <form data-form="recipe" data-id="1">
          <div class="row">
            <div class="col-sm-8">
              <div class="nf-field">
                <label class="form-label" for="title">Judul Resep</label
                ><input
                  class="form-control"
                  id="title"
                  name="title"
                  type="text"
                  value="Sop Ayam Bening Gurih"
                  placeholder="Contoh: Semur Ayam Kuah"
                  required
                />
              </div>
            </div>
            <div class="col-sm-4">
              <div class="nf-field">
                <label class="form-label" for="time">Waktu & Porsi</label
                ><input
                  class="form-control"
                  id="time"
                  name="time"
                  type="text"
                  value="30 menit · 4 porsi"
                  placeholder=""
                  required
                />
              </div>
            </div>
          </div>
          <div class="nf-field">
            <label class="form-label" for="description">Deskripsi Singkat</label
            ><textarea
              class="form-control"
              id="description"
              name="description"
              placeholder="Tulis deskripsi singkat mengenai hidangan resep ini..."
              required
            >
Sop ayam hangat dengan kuah bening kaya rempah, sangat cocok dimasak untuk menu sehat keluarga.</textarea>
          </div>
          <div class="nf-field">
            <label class="form-label" for="photo">Foto Resep</label
            ><input class="form-control" id="photo" name="photo" type="file" accept="image/*" /><img
              class="nf-photo-preview"
              id="photo-preview"
              src=""
              alt="Pratinjau foto resep"
              hidden
            />
          </div>
          <div class="nf-editor-section">
            <div class="nf-editor-heading">
              <h3>Bahan-Bahan yang Dibutuhkan</h3>
              <button
                class="btn btn-soft"
                type="button"
                data-action="add-row"
                data-kind="ingredient"
              >
                + Tambah Bahan
              </button>
            </div>
            <div id="ingredient-editor">
              <div class="nf-editor-row">
                <input
                  aria-label="Bahan 1"
                  name="ingredients"
                  value="Daging Ayam · 0.5 kilogram · potong sedang"
                  required
                /><button
                  class="btn btn-icon btn-delete"
                  type="button"
                  data-action="remove-row"
                  data-id="0"
                  aria-label="Hapus bahan"
                  title="Hapus bahan"
                >
                  <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
              </div>
              <div class="nf-editor-row">
                <input
                  aria-label="Bahan 2"
                  name="ingredients"
                  value="Wortel · 0.3 kilogram · iris tipis"
                  required
                /><button
                  class="btn btn-icon btn-delete"
                  type="button"
                  data-action="remove-row"
                  data-id="1"
                  aria-label="Hapus bahan"
                  title="Hapus bahan"
                >
                  <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
              </div>
              <div class="nf-editor-row">
                <input
                  aria-label="Bahan 3"
                  name="ingredients"
                  value="Bawang Merah · 0.05 kilogram · cincang"
                  required
                /><button
                  class="btn btn-icon btn-delete"
                  type="button"
                  data-action="remove-row"
                  data-id="2"
                  aria-label="Hapus bahan"
                  title="Hapus bahan"
                >
                  <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
              </div>
              <div class="nf-editor-row">
                <input
                  aria-label="Bahan 4"
                  name="ingredients"
                  value="Bawang Putih · 0.03 kilogram · memarkan"
                  required
                /><button
                  class="btn btn-icon btn-delete"
                  type="button"
                  data-action="remove-row"
                  data-id="3"
                  aria-label="Hapus bahan"
                  title="Hapus bahan"
                >
                  <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
          <div class="nf-editor-section">
            <div class="nf-editor-heading">
              <h3>Langkah-Langkah Pembuatan</h3>
              <button class="btn btn-soft" type="button" data-action="add-row" data-kind="step">
                + Tambah Langkah
              </button>
            </div>
            <div id="step-editor">
              <div class="nf-editor-row">
                <input
                  aria-label="Langkah 1"
                  name="steps"
                  value="Rebus daging ayam hingga mendidih dan angkat buihnya."
                  required
                /><button
                  class="btn btn-icon btn-delete"
                  type="button"
                  data-action="remove-row"
                  data-id="0"
                  aria-label="Hapus langkah"
                  title="Hapus langkah"
                >
                  <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
              </div>
              <div class="nf-editor-row">
                <input
                  aria-label="Langkah 2"
                  name="steps"
                  value="Tumis bawang merah dan bawang putih hingga harum keemasan."
                  required
                /><button
                  class="btn btn-icon btn-delete"
                  type="button"
                  data-action="remove-row"
                  data-id="1"
                  aria-label="Hapus langkah"
                  title="Hapus langkah"
                >
                  <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
              </div>
              <div class="nf-editor-row">
                <input
                  aria-label="Langkah 3"
                  name="steps"
                  value="Masukkan potongan wortel dan bumbu, masak dengan api sedang."
                  required
                /><button
                  class="btn btn-icon btn-delete"
                  type="button"
                  data-action="remove-row"
                  data-id="2"
                  aria-label="Hapus langkah"
                  title="Hapus langkah"
                >
                  <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
              </div>
              <div class="nf-editor-row">
                <input
                  aria-label="Langkah 4"
                  name="steps"
                  value="Masak hingga empuk dan meresap sempurna. Sajikan hangat."
                  required
                /><button
                  class="btn btn-icon btn-delete"
                  type="button"
                  data-action="remove-row"
                  data-id="3"
                  aria-label="Hapus langkah"
                  title="Hapus langkah"
                >
                  <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
          <div class="nf-admin-submit">
            <a class="btn btn-light" href="admin.html">Batal</a
            ><button class="btn" type="submit">Simpan Perubahan Resep</button>
          </div>
        </form>
      </section>
    </main>
    <div id="nf-modal-host"></div>
    <div id="nf-toast-host" aria-live="polite"></div>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/recipe.js"></script>
    <script src="../assets/js/enhance.js"></script>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
